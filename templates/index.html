<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cliente Python Flask - TherApp</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background-color: #F4F1DE; }
        .header-therapp { background-color: #3D405B; color: #fff; }
        .btn-therapp { background-color: #81B29A; color: #fff; font-weight: 700; border: none; }
        .btn-therapp:hover { background-color: #6a9c83; color: #fff; }
        .metric-box { background: #fff; border-left: 5px solid #81B29A; border-radius: 8px; padding: 15px; }
    </style>
</head>
<body>

<nav class="navbar header-therapp py-3 shadow-sm">
    <div class="container">
        <span class="navbar-brand text-white fw-bold mb-0">
            TherApp | Análisis Cinemático con Python (Flask + SciPy)
        </span>
    </div>
</nav>

<div class="container my-5">
    <div class="row g-4">
        <div class="col-lg-5 col-12">
            <div class="card shadow border-0 rounded-3">
                <div class="card-header header-therapp py-3">
                    <h5 class="mb-0">Datos de Sesión Articular</h5>
                </div>
                <div class="card-body p-4">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Cargar escenario de prueba:</label>
                        <div class="btn-group w-100" role="group">
                            <button type="button" class="btn btn-outline-success btn-sm" onclick="cargarEjemplo('optimo')">Óptimo</button>
                            <button type="button" class="btn btn-outline-warning btn-sm" onclick="cargarEjemplo('moderado')">Moderado</button>
                            <button type="button" class="btn btn-outline-danger btn-sm" onclick="cargarEjemplo('limitado')">Limitado</button>
                        </div>
                    </div>

                    <form id="form-rehab">
                        <div class="mb-3">
                            <label for="datos" class="form-label fw-bold">Serie de ángulos (°):</label>
                            <textarea class="form-control" id="datos" rows="4" required>10, 28, 65, 98, 62, 22, 12, 30, 72, 105, 68, 25, 11, 32, 75, 102, 60, 18, 10</textarea>
                            <div class="form-text">Mínimo 8 valores numéricos separados por coma.</div>
                        </div>

                        <div class="mb-4">
                            <label for="fs" class="form-label fw-bold">Frecuencia de muestreo (Hz):</label>
                            <input type="number" class="form-control" id="fs" value="10" min="1" max="1000" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" id="btnProcesar" class="btn btn-therapp py-2">
                                Procesar en Python
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-7 col-12">
            <div class="card shadow border-0 rounded-3 h-100">
                <div class="card-header header-therapp py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Resultados Clínicos</h5>
                    <span id="estado-conexion" class="badge bg-secondary">Listo</span>
                </div>
                <div class="card-body p-4">
                    <div id="alerta-error" class="alert alert-danger d-none"></div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <div class="metric-box shadow-sm">
                                <small class="text-muted d-block">Rango Articular (ROM)</small>
                                <strong class="fs-4 text-dark" id="res-rom">-- °</strong>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="metric-box shadow-sm">
                                <small class="text-muted d-block">Velocidad Máxima</small>
                                <strong class="fs-4 text-dark" id="res-vel">-- °/s</strong>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="metric-box shadow-sm">
                                <small class="text-muted d-block">Repeticiones</small>
                                <strong class="fs-4 text-dark" id="res-rep">--</strong>
                            </div>
                        </div>
                    </div>

                    <div class="alert alert-info mb-3" id="res-diagnostico" style="border-left: 6px solid #0dcaf0;">
                        Presiona <strong>Procesar en Python</strong> para analizar la serie de movimiento.
                    </div>

                    <div class="text-center">
                        <img id="res-imagen" src="" alt="Gráfica generada por Python" class="img-fluid rounded border d-none shadow-sm">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const ejemplos = {
    optimo:   "10, 28, 65, 98, 62, 22, 12, 30, 72, 105, 68, 25, 11, 32, 75, 102, 60, 18, 10",
    moderado: "15, 30, 55, 72, 50, 25, 16, 35, 60, 75, 48, 22, 15",
    limitado: "10, 18, 28, 35, 25, 14, 11, 20, 32, 38, 24, 12, 10"
};

function cargarEjemplo(tipo) {
    document.getElementById("datos").value = ejemplos[tipo];
}

document.getElementById("form-rehab").addEventListener("submit", async function(evento) {
    evento.preventDefault();

    const badge = document.getElementById("estado-conexion");
    const alertaError = document.getElementById("alerta-error");
    const img = document.getElementById("res-imagen");
    const btn = document.getElementById("btnProcesar");

    badge.className = "badge bg-warning text-dark";
    badge.textContent = "Calculando en Python...";
    alertaError.classList.add("d-none");
    btn.disabled = true;

    const payload = {
        datos: document.getElementById("datos").value,
        fs: parseFloat(document.getElementById("fs").value)
    };

    try {
        const respuesta = await fetch("/evaluar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        const data = await respuesta.json();

        if (!respuesta.ok) {
            throw new Error(data.error || "Ocurrió un error al procesar los datos.");
        }

        badge.className = "badge bg-success";
        badge.textContent = "Conectado a Flask";

        document.getElementById("res-rom").textContent = data.rom + " °";
        document.getElementById("res-vel").textContent = data.vel_max + " °/s";
        document.getElementById("res-rep").textContent = data.repeticiones;

        const cajaDiag = document.getElementById("res-diagnostico");
        cajaDiag.className = "alert mb-3 bg-white shadow-sm";
        cajaDiag.style.borderLeft = `6px solid ${data.color}`;
        cajaDiag.innerHTML = `<strong>Diagnóstico Clínico:</strong> ${data.diagnostico}`;

        if (data.imagen) {
            img.src = data.imagen;
            img.classList.remove("d-none");
        }
    } catch (error) {
        badge.className = "badge bg-danger";
        badge.textContent = "Error";
        alertaError.textContent = error.message;
        alertaError.classList.remove("d-none");
    } finally {
        btn.disabled = false;
    }
});
</script>

</body>
</html>
